<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- ─── SEO ─────────────────────────────────────────────── -->
  <meta name="description" content="Shubham Wani — Associate Software Developer specialising in Flutter, Generative AI and Agentic AI. View projects, skills and experience.">
  <meta name="keywords" content="Shubham Wani, Flutter Developer, Generative AI, Agentic AI, Mobile Developer, Portfolio">
  <meta name="author" content="Shubham Wani">
  <meta name="robots" content="index, follow">

  <!-- ─── Open Graph ───────────────────────────────────────── -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Shubham Wani | Flutter Developer &amp; AI Engineer">
  <meta property="og:description" content="Associate Software Developer specialising in Flutter, Generative AI and Agentic AI.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- ─── Security headers (meta fallbacks) ───────────────── -->
  <!--
    Primary headers are set by the server via _headers / render.yaml.
    These meta equivalents act as a fallback for hosts that do not
    support custom HTTP headers.
  -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy"
        content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">
  <!--
    Content-Security-Policy:
    Flutter web requires 'unsafe-inline' for its bootstrap scripts and
    'wasm-unsafe-eval' for CanvasKit (WASM renderer). blob: workers are
    needed by the service worker. All other origins are blocked by default.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          script-src  'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'
                      https://www.gstatic.com;
          style-src   'self' 'unsafe-inline'
                      https://fonts.googleapis.com;
          font-src    'self' data:
                      https://fonts.gstatic.com
                      https://fonts.googleapis.com;
          img-src     'self' data: blob: https:;
          connect-src 'self' https:;
          worker-src  'self' blob:;
          child-src   'self' blob:;
          object-src  'none';
          base-uri    'self';
          form-action 'self';
          frame-ancestors 'none';
        ">

  <!-- ─── PWA / Icons ─────────────────────────────────────── -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shubham Wani">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Shubham Wani | Flutter Developer &amp; AI Engineer</title>
</head>
<body>
  <noscript>
    <p>This portfolio requires JavaScript. Please enable it in your browser settings.</p>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
